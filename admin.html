<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Shop C?a B?n — Admin</title>
<style>
:root{--bg:#05060a;--panel:#0d0f17;--panel2:#121522;--line:#1f2434;--line2:#2a3046;--text:#e9ebf3;--muted:#8a92a8;--gold:#f5c96b;--gold2:#f59e0b;--emerald:#34d399;--violet:#a78bfa;--cyan:#22d3ee;--rose:#fb7185;--amber:#fbbf24;--blue:#60a5fa}
*{box-sizing:border-box}
html{color-scheme:dark;scrollbar-color:#2a3046 #05060a}
body{margin:0;min-height:100vh;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(45% 40% at 15% 10%,rgba(124,58,237,.30),transparent 70%),radial-gradient(40% 35% at 85% 15%,rgba(34,211,238,.20),transparent 70%),radial-gradient(45% 40% at 75% 90%,rgba(245,201,107,.16),transparent 70%),radial-gradient(40% 35% at 10% 85%,rgba(251,113,133,.14),transparent 70%);filter:blur(30px);animation:auroraDrift 26s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 22%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 34% 68%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 14%,#fffb 50%,transparent 51%),radial-gradient(1px 1px at 76% 46%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 90% 82%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 88%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 46% 92%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 68% 74%,#fff7 50%,transparent 51%);opacity:.7}
@keyframes auroraDrift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}
#root{position:relative;z-index:1}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;background:rgba(7,8,13,.72);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(245,201,107,.18),0 10px 40px rgba(0,0,0,.5)}
.top h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.3px;background:linear-gradient(90deg,var(--gold),#fff 45%,var(--violet) 75%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-right{display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-weight:700;font-size:14px}
.user-chip i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;font-style:normal;font-weight:900;font-size:13px}
.top button{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:11px;padding:10px 16px;font-weight:800;cursor:pointer;transition:.18s}
.top button:hover{border-color:var(--rose);color:var(--rose);box-shadow:0 0 22px rgba(251,113,133,.25)}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
.sidebar{background:rgba(10,11,18,.95);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sidebar-label{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;padding:14px 10px 6px;margin-top:6px}
.wrap{padding:28px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:4px 0 26px}
.stat{position:relative;overflow:hidden;padding:22px 22px 20px;border-radius:20px;color:var(--muted);font-weight:700;font-size:14px;background:linear-gradient(165deg,rgba(var(--c),.17),rgba(13,15,23,.92) 62%);border:1px solid rgba(var(--c),.34);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.stat::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(var(--c),.22);filter:blur(30px)}
.stat b{position:relative;z-index:1;display:block;margin-top:10px;font-size:30px;font-weight:900;color:rgb(var(--c));text-shadow:0 0 28px rgba(var(--c),.45);letter-spacing:.3px}
.s-gold{--c:245,201,107}.s-green{--c:52,211,153}.s-violet{--c:167,139,250}.s-cyan{--c:34,211,238}
.tabs{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;background:transparent;border:none;width:100%}
.tabs button{border:0;background:transparent;color:var(--muted);padding:11px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;transition:.18s;white-space:nowrap;text-align:left;display:flex;align-items:center;gap:8px;width:100%}
.tabs button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.tabs button.active{color:#fff;background:rgba(124,58,237,.2);border-left:3px solid #7c3aed;padding-left:11px}
.tabs button:nth-child(1).active{background:rgba(6,182,212,.15);border-left-color:#06b6d4}
.tabs button:nth-child(2).active{background:rgba(245,158,11,.15);border-left-color:#f59e0b;color:var(--gold)}
.tabs button:nth-child(3).active{background:rgba(124,58,237,.15);border-left-color:#7c3aed}
.tabs button:nth-child(4).active{background:rgba(52,211,153,.15);border-left-color:#34d399;color:var(--emerald)}
.tabs button:nth-child(5).active{background:rgba(251,191,36,.15);border-left-color:#fbbf24;color:var(--amber)}
.tabs button:nth-child(6).active{background:rgba(34,211,238,.15);border-left-color:#22d3ee;color:var(--cyan)}
.tabs button:nth-child(7).active{background:rgba(139,92,246,.15);border-left-color:#8b5cf6;color:var(--violet)}
.tabs button:nth-child(8).active{background:rgba(251,113,133,.15);border-left-color:#fb7185;color:var(--rose)}
.tabs button:nth-child(9).active{background:rgba(52,211,153,.15);border-left-color:#34d399;color:var(--emerald)}
.panel{display:none;padding:26px;border-radius:22px;background:linear-gradient(180deg,rgba(18,21,34,.92),rgba(10,12,19,.94));border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.panel.active{display:block;animation:panelIn .28s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel h2{margin:0 0 18px;font-size:20px;font-weight:900;color:var(--gold);letter-spacing:.2px}
.table-wrap{overflow:auto;border-radius:16px;border:1px solid var(--line);background:rgba(6,7,12,.55)}
.table{width:100%;border-collapse:collapse;min-width:850px}
.table th,.table td{padding:14px 15px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
.table th{position:sticky;top:0;background:#0f1220;color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.2px;white-space:nowrap}
.table tr:last-child td{border-bottom:0}
.table tbody tr,.table tr:not(:first-child){transition:background .15s}
.table tr:not(:first-child):hover td{background:rgba(167,139,250,.07)}
.table td b{color:#fff}
.money{color:var(--gold)!important;font-weight:900;text-shadow:0 0 18px rgba(245,201,107,.3)}
.pos{color:var(--emerald)!important;text-shadow:0 0 16px rgba(52,211,153,.35)}
.neg{color:var(--rose)!important;text-shadow:0 0 16px rgba(251,113,133,.35)}
.ok-text{color:var(--emerald);font-weight:800}
.btn{--c:167,139,250;border:1px solid rgba(var(--c),.4);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;margin:3px;color:rgb(var(--c));background:rgba(var(--c),.12);transition:.16s}
.btn:hover{background:rgba(var(--c),.24);transform:translateY(-1px);box-shadow:0 8px 22px rgba(var(--c),.28)}
.btn:active{transform:none}
.green{--c:52,211,153}.red{--c:251,113,133}.blue{--c:96,165,250}.yellow{--c:251,191,36}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap;color:rgb(var(--c,138,146,168));background:rgba(var(--c,138,146,168),.14);border:1px solid rgba(var(--c,138,146,168),.38)}
.b-pending{--c:251,191,36}.b-working{--c:34,211,238}.b-completed,.b-approved{--c:52,211,153}.b-cancelled,.b-rejected{--c:251,113,133}.b-admin{--c:245,201,107}.b-customer{--c:96,165,250}
.notice{margin:0 0 18px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(251,191,36,.13),rgba(251,113,133,.07));border:1px solid rgba(251,191,36,.34);color:#f6d98a;font-size:14px;line-height:1.55}
.empty{padding:28px;text-align:center;color:var(--muted)}
.order-info{line-height:1.8;min-width:270px}
.secret{display:inline-block;font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:13px;color:var(--cyan);background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.24);border-radius:8px;padding:2px 8px;word-break:break-all}
.login{position:relative;max-width:440px;margin:110px auto;padding:34px 30px;border-radius:26px;background:linear-gradient(170deg,rgba(21,24,38,.94),rgba(9,10,16,.96));border:1px solid rgba(245,201,107,.34);box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 60px rgba(124,58,237,.18),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.login::before{content:"";position:absolute;inset:-40%;z-index:0;background:conic-gradient(from 0deg,rgba(34,197,94,.14),rgba(6,182,212,.14),rgba(139,92,246,.18),rgba(236,72,153,.13),rgba(34,197,94,.14));filter:blur(50px);animation:spin 22s linear infinite}
.login>*{position:relative;z-index:1}
.login h2{margin:0 0 8px;font-size:24px;font-weight:900;background:linear-gradient(90deg,var(--gold),#fff 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.login p{color:var(--muted);line-height:1.6;margin:0 0 14px}
.login input{width:100%;padding:14px 16px;margin:8px 0;border-radius:13px;border:1px solid var(--line2);background:rgba(5,6,10,.75);color:var(--text);font-size:15px;outline:none;transition:.16s}
.login input::placeholder{color:#5d657b}
.login input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,201,107,.16)}
.login button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:13px;font-weight:900;font-size:15px;letter-spacing:.3px;cursor:pointer;color:#1a1204;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 12px 32px rgba(245,158,11,.35);transition:.16s}
.login button:hover{transform:translateY(-1px);box-shadow:0 16px 40px rgba(245,158,11,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.confirm-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,3,7,.78);backdrop-filter:blur(10px)}
.confirm-overlay.show{display:flex}
.confirm-box{width:min(480px,100%);padding:28px;border-radius:24px;background:linear-gradient(170deg,#151827,#0a0b12);border:1px solid rgba(251,113,133,.4);box-shadow:0 30px 90px #000c,0 0 50px rgba(251,113,133,.14);animation:panelIn .25s ease}
.confirm-box h2{margin:0 0 12px;font-size:21px;color:var(--rose)}
.confirm-box p{color:#c9cedd;line-height:1.6}
.confirm-box .notice{margin:14px 0 0}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.confirm-actions button{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;transition:.16s}
.cancel-confirm{background:var(--panel2);color:var(--text);border:1px solid var(--line2)!important}
.cancel-confirm:hover{border-color:var(--muted)!important}
.danger-confirm{color:#fff;background:linear-gradient(135deg,#e11d48,#be123c);box-shadow:0 10px 28px rgba(225,29,72,.4)}
.danger-confirm:hover{transform:translateY(-1px)}
.confirm-actions button:disabled{opacity:.55;cursor:wait;transform:none}
.chat-layout{display:grid;grid-template-columns:290px 1fr;gap:16px}
.chat-list,.chat-window{border-radius:18px;overflow:hidden;background:rgba(6,7,12,.6);border:1px solid var(--line)}
.chat-list-head,.chat-head{padding:15px 18px;font-weight:900;color:var(--gold);background:#0f1220;border-bottom:1px solid var(--line)}
.chat-users{max-height:560px;overflow:auto}
.chat-user{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.chat-user:hover{background:rgba(167,139,250,.08)}
.chat-user.active{background:linear-gradient(90deg,rgba(167,139,250,.2),transparent);box-shadow:inset 3px 0 0 var(--violet)}
.chat-user b{display:block;color:#fff}
.chat-user small{display:block;margin-top:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-messages{height:460px;overflow:auto;padding:18px;background:radial-gradient(60% 50% at 80% 0,rgba(124,58,237,.1),transparent 70%),#07080d}
.chat-msg{max-width:75%;margin:9px 0;padding:11px 14px;border-radius:16px;word-break:break-word;line-height:1.5;font-size:14px}
.chat-msg.customer{margin-right:auto;background:#161a29;border:1px solid var(--line2);border-bottom-left-radius:5px}
.chat-msg.admin{margin-left:auto;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-bottom-right-radius:5px;box-shadow:0 8px 24px rgba(99,102,241,.32)}
.chat-msg small{display:block;opacity:.6;margin-top:5px;font-size:11px}
.chat-compose{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#0b0d16}
.chat-compose input{flex:1;padding:13px 15px;border-radius:12px;border:1px solid var(--line2);background:#05060a;color:var(--text);outline:none;font-size:14px}
.chat-compose input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(167,139,250,.16)}
.chat-compose button{border:0;border-radius:12px;padding:0 22px;font-weight:900;cursor:pointer;color:#1a1204;background:linear-gradient(135deg,var(--gold),var(--gold2));transition:.16s}
.chat-compose button:hover{box-shadow:0 8px 24px rgba(245,158,11,.4)}
.chat-compose button:disabled,.chat-compose input:disabled{opacity:.6;cursor:wait}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#07080d}
::-webkit-scrollbar-thumb{background:#262c42;border-radius:10px;border:2px solid #07080d}
::-webkit-scrollbar-thumb:hover{background:#3a4263}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.admin-layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:none;border-bottom:1px solid var(--line)}.tabs{flex-direction:row;flex-wrap:nowrap;gap:4px}.tabs button{white-space:nowrap;flex:0 0 auto;border-left:none!important;border-bottom:3px solid transparent;padding:8px 12px;border-radius:8px}.tabs button.active{border-bottom-color:var(--violet)!important;padding-left:12px}}
@media(max-width:800px){.chat-layout{grid-template-columns:1fr}.chat-users{max-height:220px}.top{padding:14px 16px}.top h1{font-size:17px}.user-chip span{display:none}.user-chip{padding:7px}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:16px}.confirm-actions{flex-direction:column}.confirm-actions button{width:100%}.tabs{width:100%}.tabs button{flex:1 1 auto;font-size:11px;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){body::before,.login::before,.panel.active{animation:none}}
.ban-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.ban-grid .btn{margin:0;padding:16px 8px;font-size:14px}
.del-input{width:100%;padding:13px 15px;margin-top:6px;border-radius:12px;border:1px solid var(--line2);background:#05060a;color:var(--text);font-size:15px;outline:none;transition:.16s}
.del-input:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(251,113,133,.18)}
.dim-row td{opacity:.5}
.dim-row td:last-child{opacity:1}
@media(max-width:520px){.ban-grid{grid-template-columns:1fr}}
.chat-msg .st{display:block;margin-top:3px;font-size:11px;font-weight:700;text-align:right}.chat-msg .st-sent{color:#c7d2fe}.chat-msg .st-recv{color:#e0e7ff}.chat-msg .st-seen{color:#67e8f9}
.search-input{width:100%;margin:0 0 14px;padding:13px 16px;border-radius:13px;border:1px solid var(--line2);background:rgba(5,6,10,.75);color:var(--text);font-size:15px;outline:none;transition:.16s}
.search-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.16)}
.secret.order-code{white-space:nowrap;word-break:normal;font-weight:800;letter-spacing:.5px}
.svc-card{padding:18px;margin:0 0 20px;border-radius:16px;background:rgba(6,7,12,.55);border:1px solid var(--line)}
.svc-card h3{margin:0 0 12px;color:var(--gold);font-size:16px}
.svc-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.svc-form label{display:block;margin:0 0 5px;color:var(--muted);font-size:12px;font-weight:800}
.svc-form .full-row{grid-column:1/-1}
.svc-hint{margin:10px 0 0;color:var(--muted);font-size:12.5px;line-height:1.6}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.avatar-item{padding:10px;border-radius:14px;background:rgba(6,7,12,.5);border:1px solid var(--line);text-align:center}
.avatar-item img{width:100%;height:80px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:#111}
.avatar-item .name{font-size:12px;color:var(--text);font-weight:800;margin-bottom:8px;min-height:32px;display:flex;align-items:center;justify-content:center;text-align:center}
.avatar-item input[type=file]{display:none}
.avatar-item .up-btn{display:block;width:100%;padding:8px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:12px;font-weight:800;cursor:pointer}
.ip-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;margin:6px 0 0}
.ip-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:11px 12px;border-radius:11px;border:1px solid var(--line2);background:#05060a;cursor:pointer}
.ip-row input{width:17px;height:17px;margin:0;accent-color:var(--cyan)}
.ip-row.is-banned{opacity:.6;cursor:default}
.ip-addr{font-family:Consolas,Menlo,monospace;color:var(--cyan);font-weight:800}
.ip-meta{color:var(--muted);font-size:12px}
.ip-dur{grid-template-columns:repeat(4,1fr)}
.ip-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ip-form .search-input{margin:0}
@media(max-width:520px){.ip-dur,.ip-form{grid-template-columns:1fr 1fr}}
.order-note.admin-reply{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.35)}
.order-note.admin-reply span{color:#a5f3fc}
.order-note{margin-top:8px;padding:9px 11px;border-radius:10px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.32);line-height:1.5;max-width:360px}
.order-note span{display:block;margin-top:3px;color:#ddd6fe;white-space:pre-wrap;word-break:break-word}
.b-hardcoded{--c:96,165,250}.b-custom{--c:167,139,250}
.need-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.need-opt{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(5,6,10,.75);cursor:pointer;font-size:13.5px;font-weight:700;color:var(--muted);transition:.15s;user-select:none}
.need-opt input{width:17px;height:17px;margin:0;accent-color:var(--cyan);flex:none}
.need-opt:has(input:checked){border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.1);color:var(--text)}
.need-sum{font-size:11px;color:var(--muted);margin:-4px 0 8px;line-height:1.45}
.need-sum b{color:var(--cyan)}
@media(max-width:800px){.need-grid{grid-template-columns:repeat(2,1fr)}}

.group-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:12px 0}
.group-admin-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#05060a;font-size:13px}
.group-admin-item input{accent-color:var(--cyan);width:17px;height:17px}
.group-admin-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
.group-admin-card{padding:14px;border:1px solid var(--line2);border-radius:13px;background:rgba(5,6,10,.65)}
.group-admin-card b{display:block;color:var(--gold);margin-bottom:7px}
.group-admin-card small{color:var(--muted);line-height:1.6}

/* Clean, storefront-inspired hierarchy editor */

<div id="cancelConfirm" class="confirm-overlay"><div class="confirm-box"><h2>?? Xác nh?n h?y don</h2><p id="cancelConfirmText">B?n có ch?c mu?n h?y don này?</p><p class="notice">?? N?u don dã b? tr? ti?n, h? th?ng s? t? d?ng hoàn l?i dúng s? ti?n c?a don cho khách. Ch? du?c hoàn m?t l?n.</p><div class="confirm-actions"><button class="cancel-confirm" onclick="closeCancelConfirm()">Không, quay l?i</button><button id="confirmCancelBtn" class="danger-confirm" onclick="confirmCancelOrder()">Xác nh?n h?y + hoàn ti?n</button></div></div></div>
<script>
const SUPABASE_URL=window.SUPABASE_URL||localStorage.getItem('shopzicl_supabase_url');
const SUPABASE_ANON_KEY=window.SUPABASE_ANON_KEY||localStorage.getItem('shopzicl_supabase_anon_key');
let token=localStorage.getItem('shopzicl_access_token');
let profile=null,pendingCancelId=null,pendingCancelLabel='',cancelBusy=false;
const ORDER_COLS='id,user_id,service_name,package_name,price,status,account,password,game_username,game_password,phone_number,login_support_code,extra_data,created_at,updated_at';
async function fetchOrders(){try{return await api('orders?select='+ORDER_COLS+',order_code,customer_note,admin_note&order=created_at.desc')}catch(e){if(!/admin_note|customer_note|order_code|column|42703/i.test(String(e.message)))throw e}try{return await api('orders?select='+ORDER_COLS+',order_code,customer_note&order=created_at.desc')}catch(e){if(!/customer_note|order_code|column|42703/i.test(String(e.message)))throw e}try{return await api('orders?select='+ORDER_COLS+',order_code&order=created_at.desc')}catch(e){if(/order_code|column|42703/i.test(String(e.message)))return api('orders?select='+ORDER_COLS+'&order=created_at.desc');throw e}}
function filterOrders(){const q=(document.getElementById('orderSearch')||{value:''}).value.trim().toLowerCase();document.querySelectorAll('#orders tr[data-q]').forEach(r=>{r.style.display=r.dataset.q.includes(q)?'':'none'})}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
function money(v){return Number(v||0).toLocaleString('vi-VN')+' d'}
function badge(s){const v=String(s||'');const labels={pending:'Ch?',working:'Đang làm',completed:'Hoàn thành',cancelled:'Đã h?y',approved:'Đã duy?t',rejected:'T? ch?i'};return '<span class="badge b-'+esc(v.toLowerCase())+'">'+esc(labels[v.toLowerCase()]||v)+'</span>'}
function parseExtra(extra){
  if(extra===null||extra===undefined||extra==='')return null;
  if(typeof extra==='object')return extra;
  const raw=String(extra).trim();
  try{const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')return parsed}catch{}
  return raw;
}
function pickExtra(extra,keys){
  const x=parseExtra(extra);
  if(!x)return '';
  if(typeof x==='object'){
    for(const k of keys){if(x[k]!==undefined&&x[k]!==null&&String(x[k]).trim()!=='')return String(x[k]).trim()}
    const nested=[x.data,x.order_data,x.orderData,x.contact,x.login,x.credentials];
    for(const n of nested){if(n&&typeof n==='object'){for(const k of keys){if(n[k]!==undefined&&n[k]!==null&&String(n[k]).trim()!=='')return String(n[k]).trim()}}}
    return '';
  }
  const raw=x;
  for(const label of keys){
    const re=new RegExp('(?:'+label.replace(/[.*+?^${}()|[\\]\\]/g,'\\\\$&')+')\\s*[:=]\\s*([^|;\\n]+)','i');
    const m=raw.match(re);if(m&&m[1])return m[1].trim();
  }
  return '';
}
function backupCode(extra){return pickExtra(extra,['support_code','login_support_code','loginSupportCode','supportCode','login_support','loginSupport','backup_code','backupCode','recovery_code','recoveryCode','backup','recovery','ma_du_phong','maDuPhong','Mã d? phòng Roblox','Mã d? phòng Roblox','Mã d? phòng Roblox','Mã khôi ph?c'])}
function phoneNumber(extra){return pickExtra(extra,['phone','phone_number','phoneNumber','phone_code','sdt','so_dien_thoai','soDienThoai','mobile','mobile_number','mobileNumber','SĐT','S? di?n tho?i','So dien thoai'])}


async function api(path,options={}){if(!SUPABASE_URL||!SUPABASE_ANON_KEY)throw Error('Chua c?u hình Supabase URL/Anon Key.');const headers={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+(token||SUPABASE_ANON_KEY),'Content-Type':'application/json',...(options.headers||{})};const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers});const text=await r.text();if(!r.ok){const expired=r.status===401||/JWT expired/i.test(text);if(expired&&!options._retried&&token){if(await refreshSession())return api(path,{...options,_retried:true});throw Error('Phiên dang nh?p admin dã h?t h?n. Hãy dang xu?t r?i dang nh?p l?i.')}throw Error(text||r.statusText)}return text?JSON.parse(text):null}
async function rpc(fn,body){return api('rpc/'+fn,{method:'POST',body:JSON.stringify(body)})}
let refreshing=null;
function refreshSession(){if(refreshing)return refreshing;refreshing=(async()=>{const rt=localStorage.getItem('shopzicl_refresh_token');if(!rt)return false;try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});const d=await r.json();if(!r.ok||!d.access_token)return false;token=d.access_token;localStorage.setItem('shopzicl_access_token',token);if(d.refresh_token)localStorage.setItem('shopzicl_refresh_token',d.refresh_token);return true}catch(e){return false}})().finally(()=>{refreshing=null});return refreshing}
async function getAuthUser(retry=true){if(!token)return null;const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+token}});if(!r.ok){if(retry&&await refreshSession())return getAuthUser(false);return null}return r.json()}
async function init(){if(!SUPABASE_URL||!SUPABASE_ANON_KEY){showSetup();return}try{const u=await getAuthUser();if(!u){showLogin();return}const rows=await api('profiles?select=id,username,role,balance,created_at&id=eq.'+encodeURIComponent(u.id));profile=rows[0];if(!profile||profile.role!=='admin'){showDenied();return}render()}catch(e){showLogin(e.message)}}
function showSetup(){root.innerHTML='<div class="login"><h2>? C?u hình Admin</h2><p>Đ?t Supabase URL và anon key tru?c khi dùng.</p><input id="su" placeholder="https://xxxx.supabase.co"><input id="sk" placeholder="Supabase anon key"><button onclick="saveSetup()">LUU C?U HÌNH</button></div>'}
function saveSetup(){localStorage.setItem('shopzicl_supabase_url',document.getElementById('su').value.trim());localStorage.setItem('shopzicl_supabase_anon_key',document.getElementById('sk').value.trim());location.reload()}
function showLogin(msg=''){root.innerHTML='<div class="login"><h2>?? Shop C?a B?n Admin</h2><p>'+esc(msg||'Đang nh?p tài kho?n Admin c?a shop.')+'</p><input id="em" type="email" placeholder="Email Admin"><input id="pw" type="password" placeholder="M?t kh?u"><button onclick="login()">ĐANG NH?P</button></div>'}
async function login(){try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||'Đang nh?p th?t b?i');token=d.access_token;localStorage.setItem('shopzicl_access_token',token);if(d.refresh_token)localStorage.setItem('shopzicl_refresh_token',d.refresh_token);init()}catch(e){alert(e.message)}}

function chatStatusHtml(m){if(!chatStatusOn)return '<span class="st st-sent">? Đã g?i</span>';if(m.read_at)return '<span class="st st-seen">?? Đã xem</span>';if(m.delivered_at)return '<span class="st st-recv">?? Đã nh?n</span>';return '<span class="st st-sent">? Đã g?i</span>'}

async function loadAdminMessages(){
 if(!chatUserId)return;
 try{
  const base='shop_chat_messages?select=id,sender_role,message,created_at';
  const filt='&user_id=eq.'+encodeURIComponent(chatUserId)+'&order=created_at.asc';
  let rows;
  try{rows=await api(base+(chatStatusOn?',delivered_at,read_at':'')+filt)}catch(e){if(chatStatusOn&&/delivered_at|read_at|column|42703/i.test(String(e.message))){chatStatusOn=false;rows=await api(base+filt)}else throw e}
  const box=document.getElementById('chatMessages'); if(!box)return;
  if(chatStatusOn&&document.visibilityState==='visible'&&rows.some(m=>m.sender_role==='customer'&&!m.read_at))await chatSeenRpc(chatUserId,true);
  const sig=JSON.stringify(rows);
  if(sig===adminChatSig&&!chatForceBottom)return;
  const stick=chatForceBottom||box.scrollHeight-box.scrollTop-box.clientHeight<80;
  adminChatSig=sig;
  box.innerHTML=rows.length?rows.map(m=>{const adm=m.sender_role==='admin';return '<div class="chat-msg '+(adm?'admin':'customer')+'">'+esc(m.message)+'<small>'+new Date(m.created_at).toLocaleString('vi-VN')+'</small>'+(adm?chatStatusHtml(m):'')+'</div>'}).join(''):'<div class="empty">Chua có tin nh?n.</div>';
  if(stick)box.scrollTop=box.scrollHeight;
  chatForceBottom=false;
 }catch(e){console.error(e)}
}
async function sendAdminChat(){

 if(!chatUserId)return alert('Hãy ch?n khách tru?c.');

 const message=input.value.trim();
 if(!message)return;
 adminChatSending=true;
 input.disabled=true;
 if(button){button.disabled=true;button.textContent='Đang g?i...';}
 try{
  await api('shop_chat_messages',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({user_id:chatUserId,sender_role:'admin',message})});
  input.value='';chatForceBottom=true;
  await loadAdminMessages();
  await loadChatUsers();
 }catch(e){
  alert('Không g?i du?c tin nh?n: '+e.message);
 }finally{
  adminChatSending=false;
  input.disabled=false;
  if(button){button.disabled=false;button.textContent='G?i';}
  input.focus();
 }
}

async function resizeImageFile(file,maxW=480,quality=.75){
 return new Promise((res,rej)=>{
  if(!file.type.startsWith('image/'))return rej(Error('Vui lòng ch?n m?t file ?nh'));
  if(file.size>10*1024*1024)return rej(Error('?nh quá l?n, ch?n ?nh du?i 10MB'));
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/webp',quality))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(Error('Không d?c du?c ?nh'))};
  img.src=url;
 });
}

function submitServiceEdit(){

  }

   for(const nn of notes){try{await saveSvcPkgNote(svc,nn.pkg,nn.note)}catch(e){throw pkgNoteMissing(e)?Error(PKG_NOTE_SETUP_MSG):e}}
   if(svcFieldsOn)await saveServiceFields(svc,need);

  if(file){const data=await resizeImageFile(file);await rpc('admin_set_avatar',{p_service:svc,p_avatar:data})}

async function refreshGrantList(badges,users){

  list.innerHTML='<div class="table-wrap"><table class="table" style="min-width:560px"><thead><tr><th>Huy chuong</th><th>Khách</th><th>Ngày t?ng</th><th>Thao tác</th></tr></thead><tbody>'+
   g.map(x=>{const b=bm[x.badge_id]||{name:'(dã xóa)'},u=um[x.user_id]||{username:x.user_id};return '<tr><td><span style="display:inline-flex;align-items:center;gap:10px">'+badgeImgHtml(b,36)+'<b>'+esc(b.name)+'</b></span></td><td>'+esc(u.username)+'</td><td>'+new Date(x.created_at).toLocaleString('vi-VN')+'</td><td><button class="btn red" onclick="revokeBadge(\''+esc(x.id)+'\')">? Thu h?i</button></td></tr>'}).join('')+
   '</tbody></table></div>';

}
async function giveBadge(){
