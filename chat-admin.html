<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Chat với Admin – KKstore</title>

<style>
:root{
  color-scheme:dark;
  --bg:#090909;
  --panel:#151313;
  --panel2:#1d1717;
  --line:rgba(255,255,255,.09);
  --muted:#b7a9a9;
  --text:#fff7f7;
  --red:#ef3434;
  --red2:#b91c1c;
  --red-soft:rgba(239,52,52,.14);
  --green:#5ee0a0;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
body{
  min-height:100vh;padding:28px 18px 36px;
  background:
    radial-gradient(ellipse at 12% 0%,rgba(185,28,28,.22),transparent 38%),
    radial-gradient(ellipse at 92% 14%,rgba(239,52,52,.11),transparent 34%),
    linear-gradient(180deg,#100b0b 0%,#090909 55%,#0d0909 100%);
}
button,textarea,a{font:inherit}
.wrap{width:min(100%,1040px);margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 auto 18px;padding:0 2px}
.brand{display:flex;align-items:center;gap:11px;font-weight:900;font-size:19px;letter-spacing:.5px;color:#fff}
.brand::before{content:"✦";display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#ff5555,#a50f0f);box-shadow:0 8px 24px #e11d1d44;color:#fff;font-size:20px}
.back{display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:#ffffff08;color:#f3dede;text-decoration:none;font-weight:700;font-size:13px;transition:.2s}
.back:hover{border-color:#ef4444;background:var(--red-soft);color:#fff}
.card{border:1px solid rgba(255,90,90,.19);border-radius:22px;background:linear-gradient(155deg,rgba(29,22,22,.98),rgba(15,13,13,.98));box-shadow:0 24px 75px #0009,0 0 0 1px #ffffff04;overflow:hidden}
.head{min-height:68px;padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(90deg,rgba(185,28,28,.17),transparent 65%)}
.head strong{font-size:16px;letter-spacing:.1px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--green);font-weight:800;white-space:nowrap}
.status::first-letter{color:var(--green)}
.identity{padding:12px 22px;color:#c9baba;font-size:12px;border-bottom:1px solid var(--line);background:#ffffff03}
.identity b{color:#fff;font-weight:800}
.messages{height:min(64vh,640px);min-height:340px;overflow:auto;padding:20px 22px;display:flex;flex-direction:column;gap:9px;background:radial-gradient(ellipse at 50% 0%,rgba(185,28,28,.055),transparent 60%),#0b0909}
.messages::-webkit-scrollbar{width:8px}
.messages::-webkit-scrollbar-thumb{background:#6b2828;border-radius:99px}
.empty{margin:auto;text-align:center;color:#a99a9a;line-height:1.8;max-width:360px}
.empty::before{content:"💬";display:block;font-size:34px;margin-bottom:9px;filter:saturate(.75)}
.bubble{width:fit-content;max-width:min(68%,560px);padding:8px 12px;border-radius:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;box-shadow:0 3px 10px #0002}
.bubble.customer{align-self:flex-end;background:linear-gradient(135deg,#e43b3b,#a91919);border:1px solid #ff777766;border-bottom-right-radius:5px;color:#fff}
.bubble.admin{align-self:flex-start;background:linear-gradient(145deg,#282020,#1a1515);border:1px solid #ffffff17;border-bottom-left-radius:5px;color:#fff4f4}
.meta{display:block;margin-top:4px;font-size:9px;line-height:1.3;color:#f4dada;opacity:.76}
.compose{padding:16px;display:flex;gap:10px;border-top:1px solid var(--line);background:#151010}
.compose textarea{flex:1;resize:none;min-height:48px;max-height:140px;padding:13px 15px;border:1px solid #513131;border-radius:14px;background:#0c0909;color:var(--text);font:inherit;font-size:14px;line-height:1.5;outline:none;transition:.2s}
.compose textarea::placeholder{color:#8e7d7d}
.compose textarea:focus{border-color:#ef4444;box-shadow:0 0 0 3px #ef444422}
.send{min-width:104px;border:0;border-radius:14px;padding:0 22px;background:linear-gradient(135deg,#ff4b4b,#b91c1c);color:white;font-weight:900;letter-spacing:.5px;cursor:pointer;box-shadow:0 8px 22px #b91c1c44;transition:transform .18s,filter .18s}
.send:hover{filter:brightness(1.1);transform:translateY(-1px)}
.send:disabled{opacity:.5;cursor:not-allowed;transform:none}
.hint{text-align:center;color:#9d8d8d;font-size:11px;padding:0 12px 15px;background:#151010}
.notice{margin:15px 0 0;padding:13px 16px;border:1px solid #7f292944;background:rgba(100,20,20,.18);color:#d8bcbc;border-radius:14px;font-size:12px;line-height:1.65}
.gate{padding:48px 24px;text-align:center}
.gate h2{margin:0 0 10px;color:#ff6666;font-size:22px}
.gate p{color:var(--muted);line-height:1.7}
.gate a{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;padding:12px 19px;border-radius:12px;border:0;background:linear-gradient(135deg,#ff4b4b,#b91c1c);color:#fff;font-weight:900;text-decoration:none;cursor:pointer;box-shadow:0 8px 24px #b91c1c44}
.error{color:#fecaca;font-size:13px;padding:10px 20px;display:none;background:#7f1d1d22;border-bottom:1px solid #7f1d1d55}
@media(max-width:640px){
 body{padding:15px 11px 24px}
 .top{align-items:center;margin-bottom:13px}
 .brand{font-size:15px;gap:8px}
 .brand::before{width:36px;height:36px;border-radius:12px;font-size:17px}
 .back{padding:9px 12px;font-size:12px}
 .card{border-radius:18px}
 .head{padding:15px 16px;min-height:60px}
 .head strong{font-size:14px}
 .identity{padding:11px 16px}
 .messages{height:66vh;min-height:300px;padding:16px 13px;gap:11px}
 .bubble{max-width:89%;font-size:13px;padding:11px 13px}
 .compose{padding:11px;gap:8px}
 .compose textarea{min-width:0;padding:11px 12px;min-height:46px;font-size:13px}
 .send{min-width:76px;padding:0 13px;font-size:12px}
 .hint{font-size:10px}
 .notice{font-size:11px;padding:11px 13px}
}
@media(max-width:380px){.brand{font-size:13px}.back{font-size:11px;padding:8px 10px}.send{min-width:66px}}

.faq-area{padding:13px 18px 15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1b1111,#151010)}.faq-title{margin:0 0 9px;color:#f4dada;font-size:11px;font-weight:800}.faq-list{display:flex;flex-wrap:wrap;gap:7px}.faq-chip{border:1px solid #743333;border-radius:999px;padding:8px 12px;background:#281313;color:#ffdede;font-size:11px;font-weight:700;cursor:pointer}.faq-chip:hover{border-color:#ef4444;background:#471717}.faq-chip:disabled{opacity:.5;cursor:wait}.faq-empty{font-size:11px;color:#9d8d8d}
</style>
</head>

<body>
<div class="wrap">

  <header class="top">
    <div class="brand">💬 CHAT VỚI ADMIN</div>
    <a class="back" href="index.html">← Quay lại shop</a>
  </header>

  <main class="card" id="app">
    <div class="gate">
      <h2>Đang kết nối...</h2>
      <p>Vui lòng chờ trong giây lát.</p>
    </div>
  </main>

  <div class="notice">
    🔒 Tin nhắn trong cuộc trò chuyện này chỉ tài khoản của bạn và admin được phép đọc.
    Không chia sẻ mật khẩu hoặc thông tin nhạy cảm qua chat.
  </div>

</div>

<script>
'use strict';

/* =========================================
   CẤU HÌNH SUPABASE
========================================= */

const SUPABASE_URL =
  'https://zccxwrmrkbqcpbwzbbbz.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_Qkv8BegNMvtXSLRRi7PQHA_yteS0bJM';

const AUTH_URL =
  SUPABASE_URL + '/functions/v1/username-auth';


/* =========================================
   THÔNG TIN ĐĂNG NHẬP
========================================= */

let accessToken =
  localStorage.getItem('shopzicl_username_token') || '';

let currentUser = null;
let loading = false;
let lastSignature = '';
let poller = null;

const app = document.getElementById('app');


/* =========================================
   HÀM XỬ LÝ DỮ LIỆU
========================================= */

const esc = v =>
  String(v ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));


/* =========================================
   K?T N?I SUPABASE REST API
========================================= */

async function api(path, opt = {}) {

  const response = await fetch(
    SUPABASE_URL + '/rest/v1/' + path,
    {
      ...opt,
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
        ...(opt.headers || {})
      }
    }
  );

  const resultText = await response.text();

  if (!response.ok) {
    throw Error(resultText || response.statusText);
  }

  return resultText ? JSON.parse(resultText) : null;
}


/* =========================================
   GỬI RPC
========================================= */

async function rpc(name, body) {

  return api('rpc/' + name, {
    method: 'POST',
    body: JSON.stringify(body)
  });

}


/* =========================================
   KIỂM TRA TÀI KHOẢN
========================================= */

async function getProfile() {

  if (!accessToken) return null;

  const response = await fetch(AUTH_URL, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: 'Bearer ' + accessToken,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      action: 'me'
    })
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok || !data.user) {
    throw Error(data.error || 'Phiên đăng nhập đã hết hạn.');
  }

  return data.user;
}


/* =========================================
   HIỂN THỊ THÔNG BÁO
========================================= */

function showGate(title, desc, buttonText, href) {

  app.innerHTML =
    '<div class="gate">' +
      '<h2>' + esc(title) + '</h2>' +
      '<p>' + esc(desc) + '</p>' +
      '<a href="' + esc(href) + '">' +
        esc(buttonText) +
      '</a>' +
    '</div>';

}


/* =========================================
   GIAO DI?N CHAT
========================================= */

function renderShell() {

  app.innerHTML = `
    <div class="head">
      <strong>🎧 Hỗ trợ khách hàng</strong>
      <span class="status">● Đang kết nối</span>
    </div>

    <div class="identity">
      Đang chat với admin · Tài khoản:
      <b>${esc(currentUser.username || 'Khách')}</b>
    </div>
    <div class="faq-area"><div class="faq-title">💡 CÂU HỎI THƯỜNG GẶP · Chạm để nhận trả lời ngay</div><div id="faqQuestions" class="faq-list"><span class="faq-empty">Đang tải câu hỏi...</span></div></div>
    <div id="chatError" class="error"></div>

    <div id="messages" class="messages">
      <div class="empty">
        Chưa có tin nhắn.<br>
        Hãy gửi lời nhắn nếu bạn cần hỗ trợ nhé!
      </div>
    </div>

    <div class="compose">
      <textarea
        id="messageInput"
        maxlength="2000"
        rows="1"
        placeholder="Nhập tin nhắn... (tối đa 2.000 ký tự)"
      ></textarea>

      <button class="send" id="sendBtn" type="button">
        GỬI
      </button>
    </div>

    <div class="hint">
      Nhấn Enter để gửi · Shift + Enter để xuống dòng
    </div>
  `;

  const input = document.getElementById('messageInput');

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height =
      Math.min(input.scrollHeight, 130) + 'px';
  });

  document
    .getElementById('sendBtn')
    .addEventListener('click', sendMessage);

}


/* =========================================
   ĐÁNH DẤU TIN NHẮN ĐÃ ĐỌC
========================================= */

async function markSeen() {

  try {

    await rpc('chat_mark_seen', {
      p_user_id: currentUser.id,
      p_read: true
    });

  } catch (error) {

    console.warn(
      'Không cập nhật được trạng thái đã đọc:',
      error
    );

  }

}


/* =========================================
   T?I TIN NH?N T? SUPABASE
========================================= */

async function loadMessages(force = false) {

  if (!currentUser) return;

  try {

    const rows = await api(
      'shop_chat_messages' +
      '?select=id,user_id,sender_role,message,created_at,delivered_at,read_at' +
      '&user_id=eq.' + encodeURIComponent(currentUser.id) +
      '&order=created_at.asc' +
      '&limit=500'
    );

    const signature = JSON.stringify(rows);

    if (signature === lastSignature && !force) {
      return;
    }

    const box = document.getElementById('messages');

    if (!box) return;

    const nearBottom =
      force ||
      box.scrollHeight - box.scrollTop - box.clientHeight < 100;

    lastSignature = signature;

    box.innerHTML = rows.length
      ? rows.map(m => `
          <div class="bubble ${
            m.sender_role === 'admin' ? 'admin' : 'customer'
          }">
            ${esc(m.message)}

            <small class="meta">
              ${new Date(m.created_at).toLocaleString('vi-VN')}
              ${m.sender_role === 'customer'
                ? ' · Đã gửi'
                : ' · Admin'}
            </small>
          </div>
        `).join('')
      : `
          <div class="empty">
            Chưa có tin nhắn.<br>
            Hãy gửi lời nhắn nếu bạn cần hỗ trợ nhé!
          </div>
        `;

    if (nearBottom) {
      box.scrollTop = box.scrollHeight;
    }

    if (
      document.visibilityState === 'visible' &&
      rows.some(m => m.sender_role === 'admin')
    ) {
      await markSeen();
    }

    const status = document.querySelector('.status');

    if (status) {
      status.textContent = '● Đang kết nối';
    }

  } catch (error) {

    showError('Không tải được tin nhắn: ' + error.message);

  }

}


/* =========================================
   HI?N TH? L?I
========================================= */

function showError(message) {

  const el = document.getElementById('chatError');

  if (el) {
    el.textContent = message;
    el.style.display = 'block';
  }

}



/* ===== CÂU HỎI / TRẢ LỜI TỰ ĐỘNG ===== */
let autoReplyBusy=false;
async function loadAutoReplyQuestions(){const box=document.getElementById('faqQuestions');if(!box)return;try{const rows=await api('chat_auto_replies?select=id,question,sort_order&is_active=eq.true&order=sort_order.asc,created_at.asc');if(!box.isConnected)return;box.innerHTML=rows?.length?rows.map(x=>'<button type="button" class="faq-chip" data-id="'+esc(x.id)+'">'+esc(x.question)+'</button>').join(''):'<span class="faq-empty">Hiện chưa có câu hỏi gợi ý.</span>';box.querySelectorAll('.faq-chip').forEach(b=>b.addEventListener('click',()=>sendAutoReply(b.dataset.id)))}catch(e){if(box.isConnected)box.innerHTML='<span class="faq-empty">Chưa tải được câu hỏi. Bạn vẫn có thể nhắn trực tiếp cho admin.</span>';console.warn(e)}}
async function sendAutoReply(id){if(autoReplyBusy||!currentUser)return;autoReplyBusy=true;const buttons=document.querySelectorAll('.faq-chip');buttons.forEach(b=>b.disabled=true);try{await rpc('chat_send_auto_reply',{p_reply_id:id,p_user_id:currentUser.id});lastSignature='';await loadMessages(true)}catch(e){showError('Không gửi được câu trả lời tự động: '+e.message)}finally{autoReplyBusy=false;buttons.forEach(b=>b.disabled=false)}}

/* =========================================
   GỬI TIN NHẮN LÊN SUPABASE
========================================= */

async function sendMessage() {

  if (loading) return;

  const input =
    document.getElementById('messageInput');

  const btn =
    document.getElementById('sendBtn');

  const message = input.value.trim();

  if (!message) return;

  if (message.length > 2000) {
    return showError('Tin nhắn tối đa 2.000 ký tự.');
  }

  loading = true;
  btn.disabled = true;
  btn.textContent = '...';

  try {

    await api('shop_chat_messages', {
      method: 'POST',

      headers: {
        Prefer: 'return=minimal'
      },

      body: JSON.stringify({
        user_id: currentUser.id,
        sender_role: 'customer',
        message: message
      })

    });

    input.value = '';
    input.style.height = 'auto';

    lastSignature = '';

    await loadMessages(true);

    input.focus();

  } catch (error) {

    showError(
      'Gửi tin nhắn thất bại: ' + error.message
    );

  } finally {

    loading = false;
    btn.disabled = false;
    btn.textContent = 'GỬI';

  }

}


/* =========================================
   KHỞI ĐỘNG CHAT
========================================= */

async function init() {

  try {

    if (!accessToken) {

      showGate(
        'Bạn chưa đăng nhập',
        'Hãy đăng nhập tài khoản shop trước khi chat với admin.',
        'Đến trang đăng nhập',
        'index.html#login'
      );

      return;
    }

    currentUser = await getProfile();

    if (currentUser.role === 'admin') {

      showGate(
        'Đây là trang chat dành cho khách',
        'Admin vui lòng sử dụng mục “Chat khách” trong trang quản trị.',
        'Mở trang Admin',
        'admin.html'
      );

      return;
    }

    renderShell();

    await loadAutoReplyQuestions();
    await loadMessages(true);
    setInterval(() => { if (document.visibilityState === 'visible') loadAutoReplyQuestions(); }, 15000);

    // T? d?ng t?i tin nhắn mới mới 3 giây
    poller = setInterval(() => {

      if (document.visibilityState === 'visible') {
        loadMessages();
      }

    }, 3000);

    document.addEventListener(
      'visibilitychange',
      () => {
        if (!document.hidden) {
          loadMessages(true);
        }
      }
    );

  } catch (error) {

    accessToken = '';

    localStorage.removeItem('shopzicl_username_token');

    showGate(
      'Phiên đăng nhập không hợp lệ',
      error.message || 'Vui lòng đăng nhập lại.',
      'Quay lại shop',
      'index.html'
    );

  }

}

init();

</script>
</body>
</html>
