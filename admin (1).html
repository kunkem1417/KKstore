<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Shop Của Bạn — Admin</title>
<style>
:root{--bg:#05060a;--panel:#0d0f17;--panel2:#121522;--line:#1f2434;--line2:#2a3046;--text:#e9ebf3;--muted:#8a92a8;--gold:#f5c96b;--gold2:#f59e0b;--emerald:#34d399;--violet:#a78bfa;--cyan:#22d3ee;--rose:#fb7185;--amber:#fbbf24;--blue:#60a5fa}
*{box-sizing:border-box}
html{color-scheme:dark;scrollbar-color:#2a3046 #05060a}
body{margin:0;min-height:100vh;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);position:relative;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(45% 40% at 15% 10%,rgba(124,58,237,.30),transparent 70%),radial-gradient(40% 35% at 85% 15%,rgba(34,211,238,.20),transparent 70%),radial-gradient(45% 40% at 75% 90%,rgba(245,201,107,.16),transparent 70%),radial-gradient(40% 35% at 10% 85%,rgba(251,113,133,.14),transparent 70%);filter:blur(30px);animation:auroraDrift 26s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 22%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 34% 68%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 14%,#fffb 50%,transparent 51%),radial-gradient(1px 1px at 76% 46%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 90% 82%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 6% 88%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 46% 92%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 68% 74%,#fff7 50%,transparent 51%);opacity:.7}
@keyframes auroraDrift{from{transform:translate3d(-2%,-1%,0) scale(1)}to{transform:translate3d(2%,2%,0) scale(1.06)}}
#root{position:relative;z-index:1}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;background:rgba(7,8,13,.72);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(245,201,107,.18),0 10px 40px rgba(0,0,0,.5)}
.top h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.3px;background:linear-gradient(90deg,var(--gold),#fff 45%,var(--violet) 75%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-right{display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-weight:700;font-size:14px}
.user-chip i{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;font-style:normal;font-weight:900;font-size:13px}
.top button{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:11px;padding:10px 16px;font-weight:800;cursor:pointer;transition:.18s}
.top button:hover{border-color:var(--rose);color:var(--rose);box-shadow:0 0 22px rgba(251,113,133,.25)}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 60px)}
.sidebar{background:rgba(10,11,18,.95);border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.sidebar-label{font-size:10px;font-weight:900;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;padding:14px 10px 6px;margin-top:6px}
.wrap{padding:28px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:4px 0 26px}
.stat{position:relative;overflow:hidden;padding:22px 22px 20px;border-radius:20px;color:var(--muted);font-weight:700;font-size:14px;background:linear-gradient(165deg,rgba(var(--c),.17),rgba(13,15,23,.92) 62%);border:1px solid rgba(var(--c),.34);box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.stat::after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(var(--c),.22);filter:blur(30px)}
.stat b{position:relative;z-index:1;display:block;margin-top:10px;font-size:30px;font-weight:900;color:rgb(var(--c));text-shadow:0 0 28px rgba(var(--c),.45);letter-spacing:.3px}
.s-gold{--c:245,201,107}.s-green{--c:52,211,153}.s-violet{--c:167,139,250}.s-cyan{--c:34,211,238}
.tabs{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;background:transparent;border:none;width:100%}
.tabs button{border:0;background:transparent;color:var(--muted);padding:11px 14px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;transition:.18s;white-space:nowrap;text-align:left;display:flex;align-items:center;gap:8px;width:100%}
.tabs button:hover{color:var(--text);background:rgba(255,255,255,.06)}
.tabs button.active{color:#fff;background:rgba(124,58,237,.2);border-left:3px solid #7c3aed;padding-left:11px}
.tabs button:nth-child(1).active{background:rgba(6,182,212,.15);border-left-color:#06b6d4}
.tabs button:nth-child(2).active{background:rgba(245,158,11,.15);border-left-color:#f59e0b;color:var(--gold)}
.tabs button:nth-child(3).active{background:rgba(124,58,237,.15);border-left-color:#7c3aed}
.tabs button:nth-child(4).active{background:rgba(52,211,153,.15);border-left-color:#34d399;color:var(--emerald)}
.tabs button:nth-child(5).active{background:rgba(251,191,36,.15);border-left-color:#fbbf24;color:var(--amber)}
.tabs button:nth-child(6).active{background:rgba(34,211,238,.15);border-left-color:#22d3ee;color:var(--cyan)}
.tabs button:nth-child(7).active{background:rgba(139,92,246,.15);border-left-color:#8b5cf6;color:var(--violet)}
.tabs button:nth-child(8).active{background:rgba(251,113,133,.15);border-left-color:#fb7185;color:var(--rose)}
.tabs button:nth-child(9).active{background:rgba(52,211,153,.15);border-left-color:#34d399;color:var(--emerald)}
.panel{display:none;padding:26px;border-radius:22px;background:linear-gradient(180deg,rgba(18,21,34,.92),rgba(10,12,19,.94));border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04)}
.panel.active{display:block;animation:panelIn .28s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel h2{margin:0 0 18px;font-size:20px;font-weight:900;color:var(--gold);letter-spacing:.2px}
.table-wrap{overflow:auto;border-radius:16px;border:1px solid var(--line);background:rgba(6,7,12,.55)}
.table{width:100%;border-collapse:collapse;min-width:850px}
.table th,.table td{padding:14px 15px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
.table th{position:sticky;top:0;background:#0f1220;color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.2px;white-space:nowrap}
.table tr:last-child td{border-bottom:0}
.table tbody tr,.table tr:not(:first-child){transition:background .15s}
.table tr:not(:first-child):hover td{background:rgba(167,139,250,.07)}
.table td b{color:#fff}
.money{color:var(--gold)!important;font-weight:900;text-shadow:0 0 18px rgba(245,201,107,.3)}
.pos{color:var(--emerald)!important;text-shadow:0 0 16px rgba(52,211,153,.35)}
.neg{color:var(--rose)!important;text-shadow:0 0 16px rgba(251,113,133,.35)}
.ok-text{color:var(--emerald);font-weight:800}
.btn{--c:167,139,250;border:1px solid rgba(var(--c),.4);border-radius:10px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;margin:3px;color:rgb(var(--c));background:rgba(var(--c),.12);transition:.16s}
.btn:hover{background:rgba(var(--c),.24);transform:translateY(-1px);box-shadow:0 8px 22px rgba(var(--c),.28)}
.btn:active{transform:none}
.green{--c:52,211,153}.red{--c:251,113,133}.blue{--c:96,165,250}.yellow{--c:251,191,36}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;font-weight:800;font-size:12px;white-space:nowrap;color:rgb(var(--c,138,146,168));background:rgba(var(--c,138,146,168),.14);border:1px solid rgba(var(--c,138,146,168),.38)}
.b-pending{--c:251,191,36}.b-working{--c:34,211,238}.b-completed,.b-approved{--c:52,211,153}.b-cancelled,.b-rejected{--c:251,113,133}.b-admin{--c:245,201,107}.b-customer{--c:96,165,250}
.notice{margin:0 0 18px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(251,191,36,.13),rgba(251,113,133,.07));border:1px solid rgba(251,191,36,.34);color:#f6d98a;font-size:14px;line-height:1.55}
.empty{padding:28px;text-align:center;color:var(--muted)}
.order-info{line-height:1.8;min-width:270px}
.secret{display:inline-block;font-family:Consolas,"SFMono-Regular",Menlo,monospace;font-size:13px;color:var(--cyan);background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.24);border-radius:8px;padding:2px 8px;word-break:break-all}
.login{position:relative;max-width:440px;margin:110px auto;padding:34px 30px;border-radius:26px;background:linear-gradient(170deg,rgba(21,24,38,.94),rgba(9,10,16,.96));border:1px solid rgba(245,201,107,.34);box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 60px rgba(124,58,237,.18),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden}
.login::before{content:"";position:absolute;inset:-40%;z-index:0;background:conic-gradient(from 0deg,rgba(34,197,94,.14),rgba(6,182,212,.14),rgba(139,92,246,.18),rgba(236,72,153,.13),rgba(34,197,94,.14));filter:blur(50px);animation:spin 22s linear infinite}
.login>*{position:relative;z-index:1}
.login h2{margin:0 0 8px;font-size:24px;font-weight:900;background:linear-gradient(90deg,var(--gold),#fff 55%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.login p{color:var(--muted);line-height:1.6;margin:0 0 14px}
.login input{width:100%;padding:14px 16px;margin:8px 0;border-radius:13px;border:1px solid var(--line2);background:rgba(5,6,10,.75);color:var(--text);font-size:15px;outline:none;transition:.16s}
.login input::placeholder{color:#5d657b}
.login input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,201,107,.16)}
.login button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:13px;font-weight:900;font-size:15px;letter-spacing:.3px;cursor:pointer;color:#1a1204;background:linear-gradient(135deg,var(--gold),var(--gold2));box-shadow:0 12px 32px rgba(245,158,11,.35);transition:.16s}
.login button:hover{transform:translateY(-1px);box-shadow:0 16px 40px rgba(245,158,11,.5)}
@keyframes spin{to{transform:rotate(360deg)}}
.confirm-overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,3,7,.78);backdrop-filter:blur(10px)}
.confirm-overlay.show{display:flex}
.confirm-box{width:min(480px,100%);padding:28px;border-radius:24px;background:linear-gradient(170deg,#151827,#0a0b12);border:1px solid rgba(251,113,133,.4);box-shadow:0 30px 90px #000c,0 0 50px rgba(251,113,133,.14);animation:panelIn .25s ease}
.confirm-box h2{margin:0 0 12px;font-size:21px;color:var(--rose)}
.confirm-box p{color:#c9cedd;line-height:1.6}
.confirm-box .notice{margin:14px 0 0}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.confirm-actions button{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;transition:.16s}
.cancel-confirm{background:var(--panel2);color:var(--text);border:1px solid var(--line2)!important}
.cancel-confirm:hover{border-color:var(--muted)!important}
.danger-confirm{color:#fff;background:linear-gradient(135deg,#e11d48,#be123c);box-shadow:0 10px 28px rgba(225,29,72,.4)}
.danger-confirm:hover{transform:translateY(-1px)}
.confirm-actions button:disabled{opacity:.55;cursor:wait;transform:none}
.chat-layout{display:grid;grid-template-columns:290px 1fr;gap:16px}
.chat-list,.chat-window{border-radius:18px;overflow:hidden;background:rgba(6,7,12,.6);border:1px solid var(--line)}
.chat-list-head,.chat-head{padding:15px 18px;font-weight:900;color:var(--gold);background:#0f1220;border-bottom:1px solid var(--line)}
.chat-users{max-height:560px;overflow:auto}
.chat-user{padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.chat-user:hover{background:rgba(167,139,250,.08)}
.chat-user.active{background:linear-gradient(90deg,rgba(167,139,250,.2),transparent);box-shadow:inset 3px 0 0 var(--violet)}
.chat-user b{display:block;color:#fff}
.chat-user small{display:block;margin-top:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-messages{height:460px;overflow:auto;padding:18px;background:radial-gradient(60% 50% at 80% 0,rgba(124,58,237,.1),transparent 70%),#07080d}
.chat-msg{max-width:75%;margin:9px 0;padding:11px 14px;border-radius:16px;word-break:break-word;line-height:1.5;font-size:14px}
.chat-msg.customer{margin-right:auto;background:#161a29;border:1px solid var(--line2);border-bottom-left-radius:5px}
.chat-msg.admin{margin-left:auto;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-bottom-right-radius:5px;box-shadow:0 8px 24px rgba(99,102,241,.32)}
.chat-msg small{display:block;opacity:.6;margin-top:5px;font-size:11px}
.chat-compose{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#0b0d16}
.chat-compose input{flex:1;padding:13px 15px;border-radius:12px;border:1px solid var(--line2);background:#05060a;color:var(--text);outline:none;font-size:14px}
.chat-compose input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(167,139,250,.16)}
.chat-compose button{border:0;border-radius:12px;padding:0 22px;font-weight:900;cursor:pointer;color:#1a1204;background:linear-gradient(135deg,var(--gold),var(--gold2));transition:.16s}
.chat-compose button:hover{box-shadow:0 8px 24px rgba(245,158,11,.4)}
.chat-compose button:disabled,.chat-compose input:disabled{opacity:.6;cursor:wait}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#07080d}
::-webkit-scrollbar-thumb{background:#262c42;border-radius:10px;border:2px solid #07080d}
::-webkit-scrollbar-thumb:hover{background:#3a4263}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.admin-layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:none;border-bottom:1px solid var(--line)}.tabs{flex-direction:row;flex-wrap:nowrap;gap:4px}.tabs button{white-space:nowrap;flex:0 0 auto;border-left:none!important;border-bottom:3px solid transparent;padding:8px 12px;border-radius:8px}.tabs button.active{border-bottom-color:var(--violet)!important;padding-left:12px}}
@media(max-width:800px){.chat-layout{grid-template-columns:1fr}.chat-users{max-height:220px}.top{padding:14px 16px}.top h1{font-size:17px}.user-chip span{display:none}.user-chip{padding:7px}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.wrap{padding:14px}.panel{padding:16px}.confirm-actions{flex-direction:column}.confirm-actions button{width:100%}.tabs{width:100%}.tabs button{flex:1 1 auto;font-size:11px;padding:8px 10px}}
@media(prefers-reduced-motion:reduce){body::before,.login::before,.panel.active{animation:none}}
.ban-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 6px}
.ban-grid .btn{margin:0;padding:16px 8px;font-size:14px}
.del-input{width:100%;padding:13px 15px;margin-top:6px;border-radius:12px;border:1px solid var(--line2);background:#05060a;color:var(--text);font-size:15px;outline:none;transition:.16s}
.del-input:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(251,113,133,.18)}
.dim-row td{opacity:.5}
.dim-row td:last-child{opacity:1}
@media(max-width:520px){.ban-grid{grid-template-columns:1fr}}
.chat-msg .st{display:block;margin-top:3px;font-size:11px;font-weight:700;text-align:right}.chat-msg .st-sent{color:#c7d2fe}.chat-msg .st-recv{color:#e0e7ff}.chat-msg .st-seen{color:#67e8f9}
.search-input{width:100%;margin:0 0 14px;padding:13px 16px;border-radius:13px;border:1px solid var(--line2);background:rgba(5,6,10,.75);color:var(--text);font-size:15px;outline:none;transition:.16s}
.search-input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.16)}
.secret.order-code{white-space:nowrap;word-break:normal;font-weight:800;letter-spacing:.5px}
.svc-card{padding:18px;margin:0 0 20px;border-radius:16px;background:rgba(6,7,12,.55);border:1px solid var(--line)}
.svc-card h3{margin:0 0 12px;color:var(--gold);font-size:16px}
.svc-form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
.svc-form label{display:block;margin:0 0 5px;color:var(--muted);font-size:12px;font-weight:800}
.svc-form .full-row{grid-column:1/-1}
.svc-hint{margin:10px 0 0;color:var(--muted);font-size:12.5px;line-height:1.6}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.avatar-item{padding:10px;border-radius:14px;background:rgba(6,7,12,.5);border:1px solid var(--line);text-align:center}
.avatar-item img{width:100%;height:80px;object-fit:cover;border-radius:10px;margin-bottom:8px;background:#111}
.avatar-item .name{font-size:12px;color:var(--text);font-weight:800;margin-bottom:8px;min-height:32px;display:flex;align-items:center;justify-content:center;text-align:center}
.avatar-item input[type=file]{display:none}
.avatar-item .up-btn{display:block;width:100%;padding:8px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:12px;font-weight:800;cursor:pointer}
.ip-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto;margin:6px 0 0}
.ip-row{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:11px 12px;border-radius:11px;border:1px solid var(--line2);background:#05060a;cursor:pointer}
.ip-row input{width:17px;height:17px;margin:0;accent-color:var(--cyan)}
.ip-row.is-banned{opacity:.6;cursor:default}
.ip-addr{font-family:Consolas,Menlo,monospace;color:var(--cyan);font-weight:800}
.ip-meta{color:var(--muted);font-size:12px}
.ip-dur{grid-template-columns:repeat(4,1fr)}
.ip-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ip-form .search-input{margin:0}
@media(max-width:520px){.ip-dur,.ip-form{grid-template-columns:1fr 1fr}}
.order-note.admin-reply{background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.35)}
.order-note.admin-reply span{color:#a5f3fc}
.order-note{margin-top:8px;padding:9px 11px;border-radius:10px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.32);line-height:1.5;max-width:360px}
.order-note span{display:block;margin-top:3px;color:#ddd6fe;white-space:pre-wrap;word-break:break-word}
.b-hardcoded{--c:96,165,250}.b-custom{--c:167,139,250}
.need-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.need-opt{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(5,6,10,.75);cursor:pointer;font-size:13.5px;font-weight:700;color:var(--muted);transition:.15s;user-select:none}
.need-opt input{width:17px;height:17px;margin:0;accent-color:var(--cyan);flex:none}
.need-opt:has(input:checked){border-color:rgba(34,211,238,.55);background:rgba(34,211,238,.1);color:var(--text)}
.need-sum{font-size:11px;color:var(--muted);margin:-4px 0 8px;line-height:1.45}
.need-sum b{color:var(--cyan)}
@media(max-width:800px){.need-grid{grid-template-columns:repeat(2,1fr)}}

.group-admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:12px 0}
.group-admin-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#05060a;font-size:13px}
.group-admin-item input{accent-color:var(--cyan);width:17px;height:17px}
.group-admin-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
.group-admin-card{padding:14px;border:1px solid var(--line2);border-radius:13px;background:rgba(5,6,10,.65)}
.group-admin-card b{display:block;color:var(--gold);margin-bottom:7px}
.group-admin-card small{color:var(--muted);line-height:1.6}
@media(max-width:520px){.group-admin-grid,.group-admin-list{grid-template-columns:1fr}}

/* Clean, storefront-inspired hierarchy editor */

<div id="cancelConfirm" class="confirm-overlay"><div class="confirm-box"><h2>⚠️ Xác nhận hủy đơn</h2><p id="cancelConfirmText">Bạn có chắc muốn hủy đơn này?</p><p class="notice">💰 Nếu đơn đã bị trừ tiền, hệ thống sẽ tự động hoàn lại đúng số tiền của đơn cho khách. Chỉ được hoàn một lần.</p><div class="confirm-actions"><button class="cancel-confirm" onclick="closeCancelConfirm()">Không, quay lại</button><button id="confirmCancelBtn" class="danger-confirm" onclick="confirmCancelOrder()">Xác nhận hủy + hoàn tiền</button></div></div></div>
<script>
const SUPABASE_URL=window.SUPABASE_URL||localStorage.getItem('shopzicl_supabase_url');
const SUPABASE_ANON_KEY=window.SUPABASE_ANON_KEY||localStorage.getItem('shopzicl_supabase_anon_key');
let token=localStorage.getItem('shopzicl_access_token');
let profile=null,pendingCancelId=null,pendingCancelLabel='',cancelBusy=false;
const ORDER_COLS='id,user_id,service_name,package_name,price,status,account,password,game_username,game_password,phone_number,login_support_code,extra_data,created_at,updated_at';
async function fetchOrders(){try{return await api('orders?select='+ORDER_COLS+',order_code,customer_note,admin_note&order=created_at.desc')}catch(e){if(!/admin_note|customer_note|order_code|column|42703/i.test(String(e.message)))throw e}try{return await api('orders?select='+ORDER_COLS+',order_code,customer_note&order=created_at.desc')}catch(e){if(!/customer_note|order_code|column|42703/i.test(String(e.message)))throw e}try{return await api('orders?select='+ORDER_COLS+',order_code&order=created_at.desc')}catch(e){if(/order_code|column|42703/i.test(String(e.message)))return api('orders?select='+ORDER_COLS+'&order=created_at.desc');throw e}}
function filterOrders(){const q=(document.getElementById('orderSearch')||{value:''}).value.trim().toLowerCase();document.querySelectorAll('#orders tr[data-q]').forEach(r=>{r.style.display=r.dataset.q.includes(q)?'':'none'})}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
function money(v){return Number(v||0).toLocaleString('vi-VN')+' d'}
function badge(s){const v=String(s||'');const labels={pending:'Chờ',working:'Đang làm',completed:'Hoàn thành',cancelled:'Đã hủy',approved:'Đã duyệt',rejected:'Từ chối'};return '<span class="badge b-'+esc(v.toLowerCase())+'">'+esc(labels[v.toLowerCase()]||v)+'</span>'}
function parseExtra(extra){
  if(extra===null||extra===undefined||extra==='')return null;
  if(typeof extra==='object')return extra;
  const raw=String(extra).trim();
  try{const parsed=JSON.parse(raw);if(parsed&&typeof parsed==='object')return parsed}catch{}
  return raw;
}
function pickExtra(extra,keys){
  const x=parseExtra(extra);
  if(!x)return '';
  if(typeof x==='object'){
    for(const k of keys){if(x[k]!==undefined&&x[k]!==null&&String(x[k]).trim()!=='')return String(x[k]).trim()}
    const nested=[x.data,x.order_data,x.orderData,x.contact,x.login,x.credentials];
    for(const n of nested){if(n&&typeof n==='object'){for(const k of keys){if(n[k]!==undefined&&n[k]!==null&&String(n[k]).trim()!=='')return String(n[k]).trim()}}}
    return '';
  }
  const raw=x;
  for(const label of keys){
    const re=new RegExp('(?:'+label.replace(/[.*+?^${}()|[\\]\\]/g,'\\\\$&')+')\\s*[:=]\\s*([^|;\\n]+)','i');
    const m=raw.match(re);if(m&&m[1])return m[1].trim();
  }
  return '';
}
function backupCode(extra){return pickExtra(extra,['support_code','login_support_code','loginSupportCode','supportCode','login_support','loginSupport','backup_code','backupCode','recovery_code','recoveryCode','backup','recovery','ma_du_phong','maDuPhong','Mã dự phòng Roblox','Mã dự phòng Roblox','Mã dự phòng Roblox','Mã khôi phục'])}
function phoneNumber(extra){return pickExtra(extra,['phone','phone_number','phoneNumber','phone_code','sdt','so_dien_thoai','soDienThoai','mobile','mobile_number','mobileNumber','SÐT','Số điện thoại','So dien thoai'])}


async function api(path,options={}){if(!SUPABASE_URL||!SUPABASE_ANON_KEY)throw Error('Chưa cấu hình Supabase URL/Anon Key.');const headers={'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+(token||SUPABASE_ANON_KEY),'Content-Type':'application/json',...(options.headers||{})};const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers});const text=await r.text();if(!r.ok){const expired=r.status===401||/JWT expired/i.test(text);if(expired&&!options._retried&&token){if(await refreshSession())return api(path,{...options,_retried:true});throw Error('Phiên đăng nhập admin đã hết hạn. Hãy đăng xuất rồi đăng nhập lại.')}throw Error(text||r.statusText)}return text?JSON.parse(text):null}
async function rpc(fn,body){return api('rpc/'+fn,{method:'POST',body:JSON.stringify(body)})}
let refreshing=null;
function refreshSession(){if(refreshing)return refreshing;refreshing=(async()=>{const rt=localStorage.getItem('shopzicl_refresh_token');if(!rt)return false;try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});const d=await r.json();if(!r.ok||!d.access_token)return false;token=d.access_token;localStorage.setItem('shopzicl_access_token',token);if(d.refresh_token)localStorage.setItem('shopzicl_refresh_token',d.refresh_token);return true}catch(e){return false}})().finally(()=>{refreshing=null});return refreshing}
async function getAuthUser(retry=true){if(!token)return null;const r=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+token}});if(!r.ok){if(retry&&await refreshSession())return getAuthUser(false);return null}return r.json()}
async function init(){if(!SUPABASE_URL||!SUPABASE_ANON_KEY){showSetup();return}try{const u=await getAuthUser();if(!u){showLogin();return}const rows=await api('profiles?select=id,username,role,balance,created_at&id=eq.'+encodeURIComponent(u.id));profile=rows[0];if(!profile||profile.role!=='admin'){showDenied();return}render()}catch(e){showLogin(e.message)}}
function showSetup(){root.innerHTML='<div class="login"><h2>⚙ Cấu hình Admin</h2><p>Đặt Supabase URL và anon key trước khi dùng.</p><input id="su" placeholder="https://xxxx.supabase.co"><input id="sk" placeholder="Supabase anon key"><button onclick="saveSetup()">LƯU CẤU HÌNH</button></div>'}
function saveSetup(){localStorage.setItem('shopzicl_supabase_url',document.getElementById('su').value.trim());localStorage.setItem('shopzicl_supabase_anon_key',document.getElementById('sk').value.trim());location.reload()}
function showLogin(msg=''){root.innerHTML='<div class="login"><h2>🔐 Shop Của Bạn Admin</h2><p>'+esc(msg||'Đăng nhập tài khoản Admin của shop.')+'</p><input id="em" type="email" placeholder="Email Admin"><input id="pw" type="password" placeholder="Mật khẩu"><button onclick="login()">ĐĂNG NHẬP</button></div>'}
async function login(){try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});const d=await r.json();if(!r.ok)throw Error(d.error_description||'Đăng nhập thất bại');token=d.access_token;localStorage.setItem('shopzicl_access_token',token);if(d.refresh_token)localStorage.setItem('shopzicl_refresh_token',d.refresh_token);init()}catch(e){alert(e.message)}}
function showDenied(){root.innerHTML='<div class="login"><h2>⛔ Không có quyền</h2><p>Tài khoản này chưa được cấp quyền Admin.</p><button onclick="logout()">ĐĂNG XUẤT</button></div>'}
async function logout(){token=null;localStorage.removeItem('shopzicl_access_token');localStorage.removeItem('shopzicl_refresh_token');location.reload()}
function render(){root.innerHTML=`<header class="top"><h1>??? Shop Của Bạn — Admin</h1><div class="top-right"><div class="user-chip"><i>${esc((profile.username||'A').charAt(0).toUpperCase())}</i><span>${esc(profile.username)}</span></div><button class="logout" onclick="logout()">Đăng xuất</button></div></header><div class="admin-layout"><nav class="sidebar"><div class="sidebar-label">Menu</div><div class="tabs"><button class="active" onclick="tab('users',this)">👥 Khách hàng</button><button onclick="tab('deposits',this)">💳 Duyệt thẻ</button><button onclick="tab('orders',this)">📦 Đơn hàng</button><button onclick="tab('transactions',this)">💰 Lịch sử tiền</button><button onclick="tab('topnap',this)">🏆 Top nạp</button><button onclick="tab('accstock',this)">🗃️ Kho acc</button><button onclick="tab('chat',this)">💬 Chat khách</button><button onclick="tab('ipban',this)">?? Chờn IP</button><button onclick="tab('services',this)">🧰 Dịch vụ &amp; Giá</button><button onclick="tab('badgesMgmt',this)">🏅 Tạo huy chương</button><button onclick="tab('badgeGive',this)">🎁 Tặng huy chương</button><button onclick="tab('annMgmt',this)">📢 Thông báo</button></div></nav><main class="wrap"><section id="users" class="panel active"></section><section id="deposits" class="panel"></section><section id="orders" class="panel"></section><section id="transactions" class="panel"></section><section id="topnap" class="panel"></section><section id="accstock" class="panel"></section><section id="chat" class="panel"><div id="adminChat"></div></section><section id="ipban" class="panel"></section><section id="services" class="panel"></section><section id="badgesMgmt" class="panel"></section><section id="badgeGive" class="panel"></section><section id="annMgmt" class="panel"></section></main></div>`;loadAll();startAdminChatRealtime()}
function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');b.classList.add('active');if(id==='chat'){renderChatShell();startAdminChatRealtime()}if(id==='services')loadServiceMgmt();if(id==='badgesMgmt')loadBadgeMgmt();if(id==='badgeGive')loadBadgeGive();if(id==='annMgmt')loadAnnMgmt()}

let chatStatusOn=true,adminChatTimer=null,adminChatTick=0,adminChatSig='',chatForceBottom=false;
let bansMap={},overrides={},allUsersCache=[],allDepositsCache=[],userBusy=false,pendingDeleteName='',accStockRows=[];
function renderChatShell(){
 document.getElementById('adminChat').innerHTML='<div class="chat-layout"><div class="chat-list"><div class="chat-list-head">💬 Khách đang chat</div><div id="chatUsers" class="chat-users"><div class="empty">Đang tải...</div></div></div><div class="chat-window"><div id="chatHead" class="chat-head">Chờn m?t khách d? xem tin nh?n</div><div id="chatMessages" class="chat-messages"><div class="empty">Chưa chọn khách</div></div><div class="chat-compose"><input id="chatInput" maxlength="2000" placeholder="Nhập tin nhắn cho khách..." onkeydown="if(event.key===\'Enter\')sendAdminChat()"><button id="chatSendBtn" onclick="sendAdminChat()">Gửi</button></div></div></div>';
 loadChatUsers();
}
async function loadChatUsers(){
 try{
  const msgs=await api('shop_chat_messages?select=user_id,created_at,message&order=created_at.desc');
  const ids=[...new Set(msgs.map(x=>x.user_id))];
  const box=document.getElementById('chatUsers'); if(!box)return;
  if(!ids.length){box.innerHTML='<div class="empty">Chưa có khách nhắn tin.</div>';return}
  const users=await api('profiles?select=id,username&id=in.('+ids.join(',')+')');

function svcExtractObject(text,marker){const i=text.indexOf(marker);if(i<0)return null;const start=text.indexOf('{',i);if(start<0)return null;let depth=0,j=start;for(;j<text.length;j++){if(text[j]==='{')depth++;else if(text[j]==='}'){depth--;if(depth===0){j++;break}}}return depth===0?text.slice(start,j):null}
async function loadHardcodedCatalog(){

  const avSrc=svcExtractObject(html,'const serviceAvatars=');

   svcAvatars=new Function(...argNames,'return '+avSrc)(...argVals);
  }else svcAvatars={};
 }catch(e){console.error('Không d?c du?c d?ch v? có s?n:',e);svcCatalog={};svcAvatars={}}
}
async function resizeImageFile(file,maxW=480,quality=.75){
 return new Promise((res,rej)=>{
  if(!file.type.startsWith('image/'))return rej(Error('Vui lòng ch?n m?t file ?nh'));
  if(file.size>10*1024*1024)return rej(Error('?nh quá lần, ch?n ?nh du?i 10MB'));
  const url=URL.createObjectURL(file);
  const img=new Image();
  img.onload=()=>{let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/webp',quality))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(Error('Không d?c du?c ?nh'))};
  img.src=url;
 });
}

function renderSubgroupItemOptions(){const host=document.getElementById('svcSubItemOptions');if(host)host.innerHTML='';}

function resetServiceSubgroupForm(){svcEditingSubgroupId=null;const title=document.getElementById('svcSubFormTitle');if(title)title.textContent='Tạo nhóm dịch vụ con mới';const n=document.getElementById('svcSubName');if(n)n.value='';const o=document.getElementById('svcSubOrder');if(o)o.value='0';const p=document.getElementById('svcSubParent');if(p)p.disabled=false;renderSubgroupItemOptions([]);}
function editServiceSubgroup(id){const g=svcSubgroupsAdmin.find(x=>x.id===id);if(!g)return;svcEditingSubgroupId=id;const title=document.getElementById('svcSubFormTitle');if(title)title.textContent='Chỉnh sửa dịch vụ con';document.getElementById('svcSubParent').value=g.service_name;document.getElementById('svcSubParent').disabled=true;document.getElementById('svcSubName').value=g.subgroup_name;document.getElementById('svcSubOrder').value=g.sort_order||0;const selected=svcSubgroupItemsAdmin.filter(x=>x.subgroup_id===id).map(x=>x.package_name);renderSubgroupItemOptions(selected);document.getElementById('svcSubName').scrollIntoView({behavior:'smooth',block:'center'});}
async function saveServiceSubgroup(){
 if(svcBusy)return;
 const parent=document.getElementById('svcSubParent').value;
 const name=document.getElementById('svcSubName').value.trim();
 const order=Number(document.getElementById('svcSubOrder').value||0);
 const items=[];
 const orders=[];
 if(!parent||!name)return alert('Hãy chọn gói và nhập tên dịch vụ con.');
 if(!confirm((svcEditingSubgroupId?'Cập nhật':'Tạo')+' nhóm dịch vụ con "'+name+'" trong gói "'+parent+'"?'))return;
 svcBusy=true;
 try{await rpc('admin_save_service_subgroup',{p_id:svcEditingSubgroupId,p_service_name:parent,p_subgroup_name:name,p_sort_order:order,p_item_names:items,p_item_orders:orders});await loadServiceMgmt();resetServiceSubgroupForm();alert('Đã lưu dịch vụ con và thứ tự hiển thị.');}
 catch(e){alert('Không lưu được dịch vụ con: '+e.message)}finally{svcBusy=false}
}
async function createBoostParent(){
 if(svcBusy)return;const name=document.getElementById('svcBoostParentName').value.trim();if(!name)return alert('Nhập tên gói Cày thuê.');
 if((svcTypes[name]&&svcTypes[name]!=='boost')||svcRowsCache.some(r=>r.service===name&&r.origin==='custom'))return alert('Tên này đang được dùng cho dịch vụ khác.');
 svcBusy=true;try{await saveServiceType(name,'boost');const note=document.getElementById('svcBoostParentNote').value.trim();if(note)await saveServiceNote(name,note);if(svcFieldsOn)await saveServiceFields(name,readNeed('svcBoostNeed_'));const f=document.getElementById('svcBoostParentAvatar');if(f.files&&f.files[0])await rpc('admin_set_avatar',{p_service:name,p_avatar:await resizeImageFile(f.files[0])});await rpc('admin_set_service_package_order',{p_service_name:name,p_sort_order:Number(document.getElementById('svcBoostParentOrder').value||0)});document.getElementById('svcBoostParentName').value='';f.value='';await loadServiceMgmt();alert('Đã tạo gói Cày thuê. Tiếp theo hãy tạo các nhóm dịch vụ con bên dưới.');}catch(e){alert('Không tạo được gói: '+e.message)}finally{svcBusy=false}
}
async function createStandaloneService(){

function manageSubgroupItems(id){const g=svcSubgroupsAdmin.find(x=>x.id===id);const host=document.getElementById('svcSubgroupItemManager');if(!g||!host)return;svcManagingSubgroupId=id;const selected=new Set(svcSubgroupItemsAdmin.filter(x=>x.subgroup_id===id).map(x=>x.package_name));host.innerHTML='<div class="svc-card"><div class="svc-section-heading"><div><span class="svc-step-label">BƯỚC 3</span><h4>Chọn dịch vụ cho: '+esc(g.subgroup_name)+'</h4><p>Gói: '+esc(g.service_name)+' · Mỗi dịch vụ thực tế chỉ được gán vào một nhóm dịch vụ con.</p></div></div><div class="group-admin-grid">'+(svcStandaloneItems.length?svcStandaloneItems.map(x=>{const locked=svcSubgroupItemsAdmin.some(m=>m.package_name===x.item_name&&m.subgroup_id!==id);return '<label class="group-admin-item '+(selected.has(x.item_name)?'is-selected ':'')+(locked?'is-locked':'')+'"><input class="svc-manage-item" type="checkbox" value="'+esc(x.item_name)+'" '+(selected.has(x.item_name)?'checked ':'')+(locked?'disabled ':'')+'><span class="svc-item-copy"><b>'+esc(x.item_name)+'</b><small>'+money(x.price)+(locked?' · Đã thuộc nhóm dịch vụ con khác':(selected.has(x.item_name)?' · Đã chọn':' · Chưa thuộc nhóm dịch vụ con'))+'</small></span><span class="svc-item-order-wrap"><small>Thứ tự</small><input class="svc-manage-order" type="number" data-item="'+esc(x.item_name)+'" value="'+(svcSubgroupItemsAdmin.find(m=>m.package_name===x.item_name&&m.subgroup_id===id)?.sort_order??((svcStandaloneItems.indexOf(x)+1)*10))+'" '+(locked?'disabled':'')+'></span></label>'}).join(''):'<div class="svc-empty-state">Chưa có dịch vụ độc lập. Hãy tạo ở mục “Tạo dịch vụ thực tế” phía trên.</div>')+'</div><div class="svc-editor-actions"><button class="btn green" onclick="saveSubgroupItems()">Lưu dịch vụ cho nhóm</button><button class="btn" onclick="document.getElementById(\'svcSubgroupItemManager\').innerHTML=\'\';svcManagingSubgroupId=null">Đóng</button></div></div>';host.scrollIntoView({behavior:'smooth',block:'center'});}
async function saveSubgroupItems(){if(svcBusy||!svcManagingSubgroupId)return;const items=[...document.querySelectorAll('.svc-manage-item:checked')].map(x=>x.value);const orders=items.map(x=>Number(document.querySelector('.svc-manage-order[data-item="'+CSS.escape(x)+'"]')?.value||0));svcBusy=true;try{await rpc('admin_assign_cay_thue_service_items',{p_subgroup_id:svcManagingSubgroupId,p_item_names:items,p_item_orders:orders});await loadServiceMgmt();manageSubgroupItems(svcManagingSubgroupId);alert('Đã cập nhật dịch vụ trong nhóm.');}catch(e){alert('Không lưu được phân nhóm: '+e.message)}finally{svcBusy=false}}

function addPkgRow(){
 const container=document.getElementById('svcPackageRows');
 if(!container)return;
 const div=document.createElement('div');
 div.className='svc-pkg-row';
 div.style.cssText='display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end';
 div.innerHTML='<div><label>Tên gói</label><input class="svc-pkg-name search-input" placeholder="Ví dụ: Level Max"></div>'+
   '<div><label>Giá (đ)</label><input class="svc-pkg-price search-input" type="number" min="1" step="1000" placeholder="30000"></div>'+
   '<button class="btn red" style="padding:10px 13px;white-space:nowrap" onclick="removePkgRow(this)" title="Xóa dòng này">✕</button>';
 container.appendChild(div);
}
function removePkgRow(btn){
 const rows=document.querySelectorAll('#svcPackageRows .svc-pkg-row');
 if(rows.length<=1){
  // Nếu chỉ còn 1 dòng thì chỉ xóa giá trị, không xóa dòng
  const row=rows[0];
  row.querySelector('.svc-pkg-name').value='';
  row.querySelector('.svc-pkg-price').value='';
  return;
 }
 btn.closest('.svc-pkg-row').remove();
}
async function addNewPackage(){
 if(svcBusy)return;
 const service=document.getElementById('svcNewService').value.trim();
 const fileInput=document.getElementById('svcNewAvatar');
 if(!service)return alert('Nhập tên dịch vụ.');
 const typeVal=document.getElementById('svcNewType').value;
 if(typeVal==='boost')return alert('Cày thuê phải tạo bằng phần Tạo gói và Tạo dịch vụ thực tế riêng.');
 // Thu thập tất cả các dòng gói
 const pkgRows=[...document.querySelectorAll('#svcPackageRows .svc-pkg-row')];
 const packages=pkgRows.map(row=>({
  pkg:row.querySelector('.svc-pkg-name').value.trim(),
  price:Number(row.querySelector('.svc-pkg-price').value)
 })).filter(x=>x.pkg);
 if(!packages.length)return alert('Nhập ít nhất một tên gói.');
 const badPrice=packages.find(x=>!Number.isFinite(x.price)||x.price<=0);
 if(badPrice)return alert('Giá của gói "'+badPrice.pkg+'" không hợp lệ.');
 svcBusy=true;
 try{
  const need=readNeed('svcNeed_');
  for(const {pkg,price} of packages){
   const isNewPkg=!(svcCatalog[service]||[]).some(x=>x[0]===pkg)&&!svcRowsCache.some(r=>r.service===service&&r.package===pkg&&r.origin==='custom');
   await rpc('admin_set_service_price',{p_service:service,p_package:pkg,p_price:price,p_new:isNewPkg});
  }
  if(svcFieldsOn)await saveServiceFields(service,need);
  await saveServiceType(service,typeVal);
  const noteVal=document.getElementById('svcNewNote').value.trim();
  if(noteVal)await saveServiceNote(service,noteVal);
  if(fileInput.files&&fileInput.files[0]){

/* ===== HUY CHƯƠNG ===== */
let badgeImgData='',badgeBusy=false,badgesCache=[];
const BADGE_SETUP_MSG='Chưa có bảng huy chương trong Supabase. Hãy chạy file badges_setup.sql trong SQL Editor của Supabase rồi tải lại trang.';
function badgeMissing(e){return /shop_badges|shop_badge_grants|42P01|PGRST205|does not exist/i.test(String(e&&e.message||e))}
function badgeImgHtml(b,size){const s=size||56;const ok=typeof b.image_data==='string'&&/^data:image\//.test(b.image_data);return '<span style="display:inline-grid;place-items:center;width:'+s+'px;height:'+s+'px;border-radius:50%;overflow:hidden;background:var(--panel2);border:2px solid var(--gold);font-size:'+Math.round(s/2)+'px;flex:0 0 '+s+'px">'+(ok?'<img src="'+esc(b.image_data)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">':'🏅')+'</span>'}
async function loadBadgeMgmt(){
 const box=document.getElementById('badgesMgmt');if(!box)return;
 if(!box.dataset.ready){
  box.dataset.ready='1';
  box.innerHTML='<h2>🏅 Tạo huy chương mới</h2>'+
  '<div style="display:grid;gap:12px;max-width:560px;margin-bottom:26px">'+
  '<label style="font-weight:800;font-size:13px;color:var(--muted)">Ảnh đại diện huy chương</label>'+
  '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span id="bdgPrev">'+badgeImgHtml({},72)+'</span><input id="bdgFile" type="file" accept="image/*" onchange="pickBadgeImg(this)" style="color:var(--muted)"></div>'+
  '<label style="font-weight:800;font-size:13px;color:var(--muted)">Tên huy chương</label>'+
  '<input id="bdgName" class="search-input" maxlength="60" placeholder="Ví dụ: Khách VIP" style="margin:0">'+
  '<label style="font-weight:800;font-size:13px;color:var(--muted)">Nội dung huy chương</label>'+
  '<textarea id="bdgContent" class="search-input" maxlength="500" rows="4" placeholder="Mô tả huy chương / điều kiện nhận" style="margin:0;resize:vertical;min-height:90px;font-family:inherit;line-height:1.6"></textarea>'+
  '<div><button id="bdgCreateBtn" class="btn green" onclick="createBadge()" style="margin:0;padding:11px 20px">➕ Tạo huy chương</button></div>'+
  '<div id="bdgMsg" style="font-size:14px"></div></div>'+
  '<h2>Huy chương hiện có</h2><div id="bdgList"><div class="empty">Đang tải...</div></div>';
 }
 await refreshBadgeList();
}
async function refreshBadgeList(){
 const list=document.getElementById('bdgList');if(!list)return;
 try{
  badgesCache=await api('shop_badges?select=id,name,content,image_data,created_at&order=created_at.desc');
  if(!badgesCache.length){list.innerHTML='<div class="empty">Chưa có huy chương nào.</div>';return}
  list.innerHTML='<div class="table-wrap"><table class="table" style="min-width:560px"><thead><tr><th>Ảnh</th><th>Tên</th><th>Nội dung</th><th>Thao tác</th></tr></thead><tbody>'+
   badgesCache.map(b=>'<tr><td>'+badgeImgHtml(b,52)+'</td><td><b>'+esc(b.name)+'</b></td><td style="white-space:pre-line;max-width:380px">'+esc(b.content||'')+'</td><td><button class="btn red" onclick="deleteBadge(\''+esc(b.id)+'\')">🗑 Xóa</button></td></tr>').join('')+
   '</tbody></table></div>';
 }catch(e){list.innerHTML='<div class="notice">'+esc(badgeMissing(e)?BADGE_SETUP_MSG:'Lỗi tải huy chương: '+e.message)+'</div>'}
}
async function pickBadgeImg(input){
 const f=input.files&&input.files[0];if(!f)return;
 try{badgeImgData=await resizeImageFile(f,256,.8);document.getElementById('bdgPrev').innerHTML=badgeImgHtml({image_data:badgeImgData},72)}
 catch(e){badgeImgData='';input.value='';alert(e.message)}
}
async function createBadge(){
 if(badgeBusy)return;
 const name=document.getElementById('bdgName').value.trim(),content=document.getElementById('bdgContent').value.trim(),msg=document.getElementById('bdgMsg'),btn=document.getElementById('bdgCreateBtn');
 if(!name){msg.innerHTML='<span class="neg">Hãy nhập tên huy chương.</span>';return}
 if(!badgeImgData){msg.innerHTML='<span class="neg">Hãy chọn ảnh đại diện cho huy chương.</span>';return}
 badgeBusy=true;btn.disabled=true;msg.textContent='Đang tạo...';
 try{
  await api('shop_badges',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({name,content,image_data:badgeImgData})});
  document.getElementById('bdgName').value='';document.getElementById('bdgContent').value='';document.getElementById('bdgFile').value='';
  badgeImgData='';document.getElementById('bdgPrev').innerHTML=badgeImgHtml({},72);
  msg.innerHTML='<span class="pos">✅ Đã tạo huy chương "'+esc(name)+'".</span>';
  await refreshBadgeList();
 }catch(e){msg.innerHTML='<span class="neg">'+esc(badgeMissing(e)?BADGE_SETUP_MSG:'Không tạo được: '+e.message)+'</span>'}
 finally{badgeBusy=false;btn.disabled=false}
}
async function deleteBadge(id){
 if(badgeBusy)return;
 const b=badgesCache.find(x=>x.id===id);
 if(!confirm('Xóa huy chương "'+(b?b.name:'')+'"? Huy chương này cũng sẽ bị thu hồi khỏi tất cả khách đã được tặng.'))return;
 badgeBusy=true;
 try{await api('shop_badges?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await refreshBadgeList()}
 catch(e){alert('Không xóa được: '+e.message)}finally{badgeBusy=false}
}
async function loadBadgeGive(){
 const box=document.getElementById('badgeGive');if(!box)return;
 let badges=[];
 try{badges=await api('shop_badges?select=id,name,content,image_data&order=created_at.desc');badgesCache=badges}
 catch(e){box.innerHTML='<h2>🎁 Tặng huy chương</h2><div class="notice">'+esc(badgeMissing(e)?BADGE_SETUP_MSG:'Lỗi tải huy chương: '+e.message)+'</div>';return}
 let users=allUsersCache&&allUsersCache.length?allUsersCache:[];
 if(!users.length){try{users=await api('profiles?select=id,username,role,balance,created_at&order=created_at.desc')}catch(e){}}
 const customers=users.filter(u=>u.role!=='admin');
 const prevB=(document.getElementById('giveBadge')||{}).value||'',prevU=(document.getElementById('giveUser')||{}).value||'';
 box.innerHTML='<h2>🎁 Tặng huy chương</h2>'+
 (badges.length?'':'<div class="notice">Chưa có huy chương nào. Hãy tạo huy chương ở mục “Tạo huy chương” trước.</div>')+
 '<div style="display:grid;gap:12px;max-width:560px;margin-bottom:26px">'+
 '<label style="font-weight:800;font-size:13px;color:var(--muted)">Chọn huy chương</label>'+
 '<select id="giveBadge" class="search-input" style="margin:0">'+badges.map(b=>'<option value="'+esc(b.id)+'"'+(b.id===prevB?' selected':'')+'>'+esc(b.name)+'</option>').join('')+'</select>'+
 '<label style="font-weight:800;font-size:13px;color:var(--muted)">Tài khoản khách nhận</label>'+
 '<input id="giveUser" class="search-input" list="giveUserList" placeholder="Nhập hoặc chọn tên tài khoản khách" autocomplete="off" value="'+esc(prevU)+'" style="margin:0">'+
 '<datalist id="giveUserList">'+customers.map(u=>'<option value="'+esc(u.username)+'"></option>').join('')+'</datalist>'+
 '<div><button id="giveBtn" class="btn yellow" onclick="giveBadge()" style="margin:0;padding:11px 20px">🎁 Tặng huy chương</button></div>'+
 '<div id="giveMsg" style="font-size:14px"></div></div>'+
 '<h2>Huy chương đã tặng</h2><div id="giveList"><div class="empty">Đang tải...</div></div>';
 await refreshGrantList(badges,users);
}
async function refreshGrantList(badges,users){
 const list=document.getElementById('giveList');if(!list)return;
 try{
  const g=await api('shop_badge_grants?select=id,badge_id,user_id,created_at&order=created_at.desc');
  if(!g.length){list.innerHTML='<div class="empty">Chưa tặng huy chương nào.</div>';return}
  const bm=Object.fromEntries((badges||[]).map(b=>[b.id,b])),um=Object.fromEntries((users||[]).map(u=>[u.id,u]));
  list.innerHTML='<div class="table-wrap"><table class="table" style="min-width:560px"><thead><tr><th>Huy chương</th><th>Khách</th><th>Ngày tặng</th><th>Thao tác</th></tr></thead><tbody>'+
   g.map(x=>{const b=bm[x.badge_id]||{name:'(đã xóa)'},u=um[x.user_id]||{username:x.user_id};return '<tr><td><span style="display:inline-flex;align-items:center;gap:10px">'+badgeImgHtml(b,36)+'<b>'+esc(b.name)+'</b></span></td><td>'+esc(u.username)+'</td><td>'+new Date(x.created_at).toLocaleString('vi-VN')+'</td><td><button class="btn red" onclick="revokeBadge(\''+esc(x.id)+'\')">↩ Thu hồi</button></td></tr>'}).join('')+
   '</tbody></table></div>';
 }catch(e){list.innerHTML='<div class="notice">'+esc(badgeMissing(e)?BADGE_SETUP_MSG:'Lỗi tải danh sách: '+e.message)+'</div>'}
}
async function giveBadge(){
 if(badgeBusy)return;
 const bid=document.getElementById('giveBadge').value,uname=document.getElementById('giveUser').value.trim(),msg=document.getElementById('giveMsg'),btn=document.getElementById('giveBtn');
 if(!bid){msg.innerHTML='<span class="neg">Chưa có huy chương để tặng.</span>';return}
 if(!uname){msg.innerHTML='<span class="neg">Hãy nhập tài khoản khách.</span>';return}
 const user=(allUsersCache||[]).find(u=>String(u.username).toLowerCase()===uname.toLowerCase());
 if(!user){msg.innerHTML='<span class="neg">Không tìm thấy tài khoản "'+esc(uname)+'".</span>';return}
 if(user.role==='admin'){msg.innerHTML='<span class="neg">Đây là tài khoản admin, hãy chọn tài khoản khách.</span>';return}
 const b=badgesCache.find(x=>x.id===bid);
 badgeBusy=true;btn.disabled=true;msg.textContent='Đang tặng...';
 try{
  await api('shop_badge_grants',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({badge_id:bid,user_id:user.id})});
  msg.innerHTML='<span class="pos">✅ Đã tặng "'+esc(b?b.name:'huy chương')+'" cho '+esc(user.username)+'.</span>';
  document.getElementById('giveUser').value='';
  await refreshGrantList(badgesCache,allUsersCache);
 }catch(e){
  const s=String(e.message);
  msg.innerHTML='<span class="neg">'+esc(badgeMissing(e)?BADGE_SETUP_MSG:(/23505|duplicate/i.test(s)?'Khách này đã có huy chương này rồi.':'Không tặng được: '+s))+'</span>';
 }finally{badgeBusy=false;btn.disabled=false}
}
async function revokeBadge(id){
 if(badgeBusy)return;
 if(!confirm('Thu hồi huy chương này khỏi khách?'))return;
 badgeBusy=true;
 try{await api('shop_badge_grants?id=eq.'+encodeURIComponent(id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await refreshGrantList(badgesCache,allUsersCache)}
 catch(e){alert('Không thu hồi được: '+e.message)}finally{badgeBusy=false}
}

/* ===== THÔNG BÁO (chỉ 1 bài tại 1 thời điểm) ===== */
let annBusy=false,annCurrent=null;
const ANN_SETUP_MSG='Chưa có bảng thông báo trong Supabase. Hãy chạy file announcement_setup.sql trong SQL Editor của Supabase rồi tải lại trang.';
function annMissing(e){return /shop_announcements|42P01|PGRST205|does not exist/i.test(String(e&&e.message||e))}
async function loadAnnMgmt(){
 const box=document.getElementById('annMgmt');if(!box)return;
 box.innerHTML='<h2>📢 Thông báo</h2><div class="empty">Đang tải...</div>';
 try{
  const rows=await api('shop_announcements?select=id,title,content,created_at&order=created_at.desc&limit=1');
  annCurrent=rows&&rows[0]?rows[0]:null;
 }catch(e){box.innerHTML='<h2>📢 Thông báo</h2><div class="notice">'+esc(annMissing(e)?ANN_SETUP_MSG:'Lỗi tải thông báo: '+e.message)+'</div>';return}
 let html='<h2>📢 Thông báo</h2><p class="notice" style="max-width:640px">Chỉ được đăng <b>1 bài</b> tại một thời điểm. Bài này hiện ở mục THÔNG BÁO trên khung chào mừng của shop. Muốn đăng bài mới, hãy xóa bài hiện tại trước.</p>';
 if(annCurrent){
  html+='<div style="max-width:640px;padding:18px;border-radius:16px;background:var(--panel2);border:1px solid var(--line2);margin-bottom:20px">'+
   '<div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:8px">BÀI ĐANG ĐĂNG · '+esc(new Date(annCurrent.created_at).toLocaleString('vi-VN'))+'</div>'+
   (annCurrent.title?'<div style="font-size:18px;font-weight:900;color:var(--gold);margin-bottom:8px;word-break:break-word">'+esc(annCurrent.title)+'</div>':'')+
   '<div style="white-space:pre-line;line-height:1.65;word-break:break-word">'+esc(annCurrent.content)+'</div>'+
   '<div style="margin-top:14px"><button id="annDelBtn" class="btn red" onclick="deleteAnnouncement()" style="margin:0">🗑 Xóa bài đăng</button></div></div>'+
   '<div id="annMsg" style="font-size:14px"></div>';
 }else{
  html+='<div style="display:grid;gap:12px;max-width:640px">'+
   '<label style="font-weight:800;font-size:13px;color:var(--muted)">Tiêu đề (không bắt buộc)</label>'+
   '<input id="annTitle" class="search-input" maxlength="120" placeholder="Ví dụ: Lịch nghỉ lễ" style="margin:0">'+
   '<label style="font-weight:800;font-size:13px;color:var(--muted)">Nội dung bài đăng</label>'+
   '<textarea id="annContent" class="search-input" maxlength="2000" rows="7" placeholder="Nhập nội dung thông báo..." style="margin:0;resize:vertical;min-height:140px;font-family:inherit;line-height:1.6"></textarea>'+
   '<div><button id="annPostBtn" class="btn green" onclick="postAnnouncement()" style="margin:0;padding:11px 20px">📤 Đăng bài</button></div>'+
   '<div id="annMsg" style="font-size:14px"></div></div>';
 }
 box.innerHTML=html;
}
async function postAnnouncement(){
 if(annBusy)return;
 const title=document.getElementById('annTitle').value.trim(),content=document.getElementById('annContent').value.trim(),msg=document.getElementById('annMsg'),btn=document.getElementById('annPostBtn');
 if(!content){msg.innerHTML='<span class="neg">Hãy nhập nội dung bài đăng.</span>';return}
 annBusy=true;btn.disabled=true;msg.textContent='Đang đăng...';
 try{
  await api('shop_announcements',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({title,content})});
  await loadAnnMgmt();
 }catch(e){
  const s=String(e.message);
  msg.innerHTML='<span class="neg">'+esc(annMissing(e)?ANN_SETUP_MSG:(/23505|duplicate/i.test(s)?'Đang có 1 bài đăng rồi. Hãy xóa bài cũ trước khi đăng bài mới.':'Không đăng được: '+s))+'</span>';
  btn.disabled=false;
 }finally{annBusy=false}
}
async function deleteAnnouncement(){
 if(annBusy||!annCurrent)return;
 if(!confirm('Xóa bài đăng hiện tại? Sau khi xóa bạn có thể đăng bài mới.'))return;
 annBusy=true;
 try{await api('shop_announcements?id=eq.'+encodeURIComponent(annCurrent.id),{method:'DELETE',headers:{Prefer:'return=minimal'}});await loadAnnMgmt()}
 catch(e){alert('Không xóa được: '+e.message)}finally{annBusy=false}
}
